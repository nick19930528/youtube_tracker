<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Cloud Run 於負載平衡器終止 HTTPS，轉成容器內 HTTP
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD DB_SOCKET CLOUD_SQL_CONNECTION_NAME DB_SSL_CA
    PassEnv YOUTUBE_API_KEY OPENAI_API_KEY APP_BASE_URL APP_DEBUG CRON_SECRET SESSION_DRIVER
    PassEnv MAIL_SMTP_HOST MAIL_SMTP_PORT MAIL_SMTP_USER MAIL_SMTP_PASSWORD MAIL_FROM_ADDRESS MAIL_FROM_NAME
    PassEnv MPG_MERCHANT_ID MPG_HASH_KEY MPG_HASH_IV MPG_TEST_MODE MPG_PUBLIC_BASE_URL
    PassEnv GCS_BUCKET GCS_PUBLIC_BASE GCS_KEY_FILE
    PassEnv PORT K_SERVICE K_REVISION K_CONFIGURATION

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/config>
        Require all denied
    </Directory>
    <Directory /var/www/html/docker>
        Require all denied
    </Directory>

    <FilesMatch "(^\.env|composer\.(json|lock)$)">
        Require all denied
    </FilesMatch>

    DirectoryIndex index.php index.html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
